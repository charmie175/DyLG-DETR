_BASE_: [
  '../runtime.yml',
  '_base_/optimizer_6x.yml',
  '_base_/rtdetr_r50vd.yml',
  '_base_/rtdetr_reader.yml',
]

# Standalone DIOR configuration for AutoDL (two RTX 3090 GPUs).
# The dataset uses COCO-format JSON files under DIOR/Annotations.
use_gpu: true
metric: COCO
num_classes: 20
classwise: false
epoch: 72
amp: false
skip_nonfinite_gradients: true
find_unused_parameters: true
log_iter: 20
save_dir: /root/autodl-tmp/dior_output
snapshot_epoch: 1
save_optimizer: true
save_only_final: false
pretrain_weights: /root/rtdetr_r50vd_6x_coco.pdparams

TrainDataset:
  name: COCODataSet
  image_dir: ''
  anno_path: Annotations/train.json
  dataset_dir: /root/autodl-tmp/DIOR/DIOR
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: ''
  anno_path: Annotations/val.json
  dataset_dir: /root/autodl-tmp/DIOR/DIOR
  allow_empty: true

TestDataset:
  name: ImageFolder
  anno_path: Annotations/val.json
  dataset_dir: /root/autodl-tmp/DIOR/DIOR

# Fixed-size batches avoid introducing an unrelated source of numerical
# variation while validating the custom DyLG backbone.
worker_num: 2
TrainReader:
  batch_size: 1
  shuffle: true
  drop_last: true
  use_shared_memory: false
  sample_transforms:
    - Decode: {}
    - RandomDistort: {prob: 0.8}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {prob: 0.8}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [640, 640], random_size: false, random_interp: false, keep_ratio: false}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - NormalizeBox: {}
    - BboxXYXY2XYWH: {}
    - Permute: {}

EvalReader:
  batch_size: 1
TestReader:
  batch_size: 1

RTDETRTransformer:
  num_queries: 300
  num_denoising: 300

DETRPostProcess:
  num_top_queries: 300
